name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check files
      run: |
        echo "=== Файлы в репозитории ==="
        ls -la
        echo "=== Строк в Bunburtale.py ==="
        wc -l Bunburtale.py
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = EchoLocation
        package.name = echolocation
        package.domain = org.echo
        source.dir = .
        source.include_exts = py
        source.exclude_dirs = bin,.buildozer,__pycache__
        version = 1.0.0
        source.main = Bunburtale.py
        requirements = python3,pygame
        orientation = landscape
        fullscreen = 1
        android.api = 31
        android.minapi = 24
        android.ndk_api = 25b
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.permissions = VIBRATE
        p4a.bootstrap = sdl2
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
    
    - name: Build APK
      run: |
        buildozer -v android debug 2>&1 | tee build.log
    
    - name: Show log tail
      if: always()
      run: |
        echo "=== Последние 80 строк лога ==="
        tail -80 build.log || true
    
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: echo-location-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: warn
