name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: pip install buildozer cython==0.29.36

    - name: Verify
      run: |
        python --version
        buildozer --version
        wc -l Bunburtale.py

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = EchoLocation
        package.name = echolocation
        package.domain = org.echo
        source.dir = .
        source.include_exts = py
        source.exclude_dirs = bin,.buildozer,__pycache__
        version = 1.0.0
        source.main = Bunburtale.py
        requirements = python3,pygame
        orientation = landscape
        fullscreen = 1
        android.api = 31
        android.minapi = 24
        android.ndk_api = 25b
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.permissions = VIBRATE
        p4a.bootstrap = sdl2

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK
      run: |
        set -e
        yes | buildozer android debug 2>&1 | tee build.log
        ls -la bin/

    - name: Show last log
      if: always()
      run: tail -100 build.log || true

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
        if-no-files-found: warn
